filters:
  - diagram

diagram:
  cache: true
  engine:
    tikz:
      header-includes:
        - '\usepackage{adjustbox, tikz-3dplot, amsmath, amsfonts}'
        - '\usetikzlibrary{arrows, angles, quotes, arrows.meta, shapes, calc}'

project:
  type: book

from: markdown+emoji

book:
  title: "Introduction to Modern Causal Inference"
  author: "Alejandro Schuler, Mark van der Laan"
  chapters:
    - index.qmd
    - part: 3-0-intro.qmd
      chapters:
      - 3-1-AL.qmd
      - 3-2-regularity.qmd
  appendices:
    - 5-1-rv-convergence.qmd
    - 5-2-L2.qmd

execute:
  freeze: auto  # re-render only when source changes

callout-icon: false

bibliography: references.bib

# must generate html and pdf SEPARATELY for tikz to work!!
format:
  html:
    theme:
      - cosmo
      - brand
    grid:
      body-width: 1200px
  pdf: {}
